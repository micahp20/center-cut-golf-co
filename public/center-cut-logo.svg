<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">Center Cut Golf Simulator</title><desc id="desc">Green left C, silver right C, gold golf pin flag through the center, with Center Cut Golf Simulator and Play Practice Compete beneath</desc><defs><linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#005f20"/><stop offset=".55" stop-color="#003d13"/><stop offset="1" stop-color="#001e0b"/></linearGradient><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e9192"/><stop offset=".38" stop-color="#e5e6e4"/><stop offset=".67" stop-color="#a5a7a6"/><stop offset="1" stop-color="#595e5e"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#956000"/><stop offset=".3" stop-color="#e5a900"/><stop offset=".58" stop-color="#ffe05d"/><stop offset="1" stop-color="#b57900"/></linearGradient><linearGradient id="wordgreen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#006321"/><stop offset="1" stop-color="#002a0e"/></linearGradient><linearGradient id="wordsilver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7b9b8"/><stop offset=".6" stop-color="#737978"/><stop offset="1" stop-color="#505657"/></linearGradient></defs>
